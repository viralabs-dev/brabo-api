name: ci

# CI da api (AT-696, ADR 0252). Lint, tipos, testes com Postgres de serviço e o
# build da imagem de produção (sem publicar: publicar por digest é da tag, AT-704).
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: read # instala @viralabs-dev/brabo-shared (GitHub Packages)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '11.3.0'

jobs:
  # Actionlint e pins do brabo-ci (AT-819). Não é check obrigatório.
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  lint:
    name: Lint e tipos
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ESLint (modo verificação)
        run: pnpm exec eslint "src/**/*.ts" "test/**/*.ts" --max-warnings 0
      - name: Typecheck (o do build)
        run: pnpm typecheck

  testes:
    name: Testes TS (api)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        # pgvector, não `postgres:16` puro: as migrations criam a extensão.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # O service acima é um Postgres descartável do runner na 5432; sem esta
      # opção o setup recusa localhost:5432 (AT-775).
      BRABO_TESTE_PERMITE_5432: '1'
      # O globalSetup do vitest cria o banco-template e um banco por worker.
      DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo
      TEST_DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # O runbook que o spec executa mora no brabo-infra (público).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-infra
          ref: dev
          path: brabo-infra
      - name: Vínculos (irmão lido, brabo-infra)
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17 (AT-773)
        with:
          irmaos: brabo-infra
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Testes com o piso de cobertura
        env:
          BRABO_INFRA_DIR: ${{ github.workspace }}/brabo-infra
        run: pnpm exec vitest run --coverage

  imagem:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # O token vai para um arquivo temporário e entra como secret do BuildKit (RN-1039).
      - name: .npmrc temporário (fora do contexto)
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > "${RUNNER_TEMP}/npmrc"
      - name: docker build
        run: docker build -f Dockerfile --secret id=npmrc,src="${RUNNER_TEMP}/npmrc" -t brabo-api:ci .

  # Imagem da PR: publica `:sha-<12 do head>` para o E2E (PR hotfix/* -> main, AT-765) e para o regressivo
  # (PR -> dev, AT-769; decisão do dono 06/11: assinada, apagada ao fechar a PR ou em 7 dias).
  # Fora de PR de fork e de Dependabot (sem packages: write).
  # Mesmas flags de Trivy e assinatura por digest do release.yml; permissões só neste job.
  # A identidade do cosign é este ci.yml (o brabo-qa aceita release|ci).
  imagem-hotfix:
    name: Imagem da PR (sha-)
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/'))) && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/viralabs-dev/brabo-api
      TRIVY_VERSION: '0.70.0'
      TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'
      TAG_SHA: sha-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # head, não o merge ref
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: .npmrc temporário (fora do contexto)
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > "${RUNNER_TEMP}/npmrc"
      - name: Tag sha-<12>
        id: v
        run: |
          echo "tag=${TAG_SHA:0:16}" >> "$GITHUB_OUTPUT"
          echo "ambiente=dev" >> "$GITHUB_OUTPUT"  # imagem da PR é dev (AT-850, RN-1065)
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          tags: |
            ${{ env.IMAGEM }}:${{ steps.v.outputs.tag }}
          build-args: |
            BRABO_VERSION=${{ steps.v.outputs.tag }}
            BRABO_AMBIENTE=${{ steps.v.outputs.ambiente }}
      - name: Instalar o binário do trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Trivy — HIGH/CRITICAL com correção reprova
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ignore=(); [ -f .trivyignore.yaml ] && ignore=(--ignorefile .trivyignore.yaml)
          trivy image --cache-dir /tmp/trivy-cache --image-src remote --no-progress \
            --format table --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            "${ignore[@]}" --exit-code 1 "${IMAGEM}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Assinar por digest e verificar no mesmo run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGEM}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGEM}@${DIGEST}" > /dev/null

  # Versão do brabo-contracts igual em package.json, lock e scripts (AT-770, RN-1038). Não é obrigatório.
  contracts-alinhado:
    name: Contracts alinhado
    uses: viralabs-dev/brabo-ci/.github/workflows/contracts-alinhado.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  # Informativos (AT-826): não são checks obrigatórios.
  readme-esqueleto:
    name: README no esqueleto
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  mapa-alinhado:
    name: Mapa alinhado
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

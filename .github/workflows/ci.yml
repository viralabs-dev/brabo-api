name: ci

# CI da api (AT-696, ADR 0252). Lint, tipos, testes com Postgres de serviço e o
# build da imagem de produção (sem publicar: publicar por digest é da tag, AT-704).
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '11.3.0'

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint (modo verificação)
        run: pnpm exec eslint "src/**/*.ts" "test/**/*.ts" --max-warnings 0
      - name: Typecheck (o do build)
        run: pnpm typecheck

  testes:
    name: Testes TS (api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pgvector, não `postgres:16` puro: as migrations criam a extensão.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # O globalSetup do vitest cria o banco-template e um banco por worker.
      DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo
      TEST_DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # O runbook que o spec executa mora no brabo-infra (público).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-infra
          ref: dev
          path: brabo-infra
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes com o piso de cobertura
        env:
          BRABO_INFRA_DIR: ${{ github.workspace }}/brabo-infra
        run: pnpm exec vitest run --coverage

  imagem:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: docker build
        run: docker build -f Dockerfile -t brabo-api:ci .

name: refs

# Confere as refs `caminho:N` (`símbolo`) das RNs no próprio PR (AT-782). Reutilizável do brabo-ci;
# ref interna quebrada reprova, o artefato `refs-patch` traz a reancoragem. NÃO é check obrigatório.
run-name: "refs ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  refs:
    uses: viralabs-dev/brabo-ci/.github/workflows/refs-com-simbolo.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0

  refs-entre-repos:
    uses: viralabs-dev/brabo-ci/.github/workflows/refs-entre-repos.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0

  rn-unica:
    uses: viralabs-dev/brabo-ci/.github/workflows/rn-unica.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0

  indice-de-rn:
    uses: viralabs-dev/brabo-ci/.github/workflows/indice-de-rn.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0

name: qa-e2e

# Liga o brabo-qa nas PRs: base main = `E2E do brabo-qa` (portão da main, AT-765); base dev = `Regressivo do
# brabo-qa` (AT-769), que atesta e NUNCA é exigido.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
